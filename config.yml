baseURL: "https://constantina-markou.github.io/"
title: Your Name
paginate: 20
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true

taxonomies:
    tag: tags

menu:
    main:
        - name: Research
          url: papers/
          weight: 1
        - name: Talks
          url: talks/
          weight: 2
        - name: CV
          url: cv.pdf
          weight: 3

params:
    description: ""
    author: Your Name
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowRssButtonInSectionTermList: false
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Your Name
          subtitle: |
            Your short biography goes here. Replace this text with a description of your current position, research interests, and background.
            <br><br>
            <div style="margin-top: 3em;"><b>News</b></div>
            <ul style="text-align: left; display: inline-block; margin-top: 0.5em; font-size: 0.85em;">
              <li>MM/YYYY: Placeholder news item.</li>
            </ul>
          imageUrl: "placeholder.jpg"
          imageWidth: 160
          imageHeight: 160
          imageTitle: Your Name
          buttons:
            - name: Research
              url: papers/
            - name: Talks
              url: talks/
            - name: CV
              url: cv.pdf
    socialIcons:
        - name: Email
          url: mailto:you@example.com
        - name: Google Scholar
          url: https://scholar.google.com/
        - name: LinkedIn
          url: https://www.linkedin.com/
        - name: ORCID
          url: https://orcid.org/

    assets:
        disableHLJS: true
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Your Name"
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
