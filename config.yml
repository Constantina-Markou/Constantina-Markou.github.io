baseURL: "https://constantina-markou.github.io/"
title: Constantina Markou
paginate: 20
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true

taxonomies:
    tag: tags

menu:
    main:
        - name: CV
          url: cv.pdf
          weight: 1

params:
    description: "Academic website of Constantina Markou"
    author: Constantina Markou
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowRssButtonInSectionTermList: false
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Constantina Markou
          subtitle: |
            I am a PhD candidate and lecturer in Economics at Radboud University in the Netherlands. My research focuses on behavioral economics, particularly the role of preferences in decision-making, with applications to sustainability and well-being. 
          imageUrl: "photo.jpg"
          imageWidth: 160
          imageHeight: 160
          imageTitle: Constantina Markou
          buttons:
            - name: CV
              url: cv.pdf
    socialIcons:
        - name: Email
          url: mailto:constantina.markou@ru.nl
        - name: LinkedIn
          url: https://www.linkedin.com/in/constantinamarkou/
        - name: ORCID
          url: https://orcid.org/0009-0000-7299-0320

    assets:
        disableHLJS: true
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Constantina Markou"
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
